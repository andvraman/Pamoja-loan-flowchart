<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CMG Financing Lifecycle</title>
<style>
  :root{
    --p:#1f4e79; --l:#4a8fd1; --fi:#b8437f; --c:#1f9e89; --e:#e39b2d; --m:#2e7d32; --ob:#6a3fa0; --enf:#8a2d2d;
    --bg:#f7f9fb; --card:#fff; --line:#c9d1da; --soft:#e3e8ee; --ink:#1d2630; --ink2:#3b4652; --mute:#6b7682;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
    font-family:"Segoe UI",Helvetica,Arial,sans-serif}
  .app{height:100vh;display:grid;grid-template-columns:1fr 300px;
    grid-template-rows:auto auto 1fr auto;gap:10px 18px;padding:14px 22px 16px}
  header{grid-column:1/3;display:flex;align-items:baseline;gap:14px}
  header h1{font-size:21px;margin:0}
  header span{font-size:12.5px;color:var(--mute)}
  .rail{display:flex;align-items:center;flex-wrap:wrap;gap:6px}
  .rl{font-size:12px;font-weight:700;color:var(--ink2);min-width:128px;display:flex;align-items:center;gap:6px}
  .dot{width:10px;height:10px;border-radius:50%;display:inline-block}
  .chip{font:inherit;font-size:12.5px;color:var(--ink2);background:var(--card);border:1px solid var(--line);
    border-radius:999px;padding:4px 11px;cursor:pointer;line-height:1.2}
  .chip b{color:var(--mute);font-weight:600;margin-right:4px}
  .chip:hover,.chip.on{border-color:var(--ink2);color:var(--ink)}
  .chip.on{background:#eef2f6}
  .rails-bottom{display:flex;flex-direction:column;gap:6px}
  .stage{min-height:0;position:relative;border:2px solid var(--p);border-radius:14px;background:#f1f5fa;padding:26px 10px 8px}
  .stage::before{content:"PO-RALG · sets, funds and oversees";position:absolute;top:-1px;left:-1px;background:var(--p);color:#fff;
    font-size:12px;font-weight:700;padding:4px 12px;border-radius:12px 0 10px 0;letter-spacing:.02em}
  .stage svg{width:100%;height:100%;display:block}
  .chip.p{border-color:#9fb5cc}
  .chip.p:hover,.chip.p.on{border-color:var(--p);background:#e6edf5}
  .rl.p{color:var(--p)}
  aside{grid-column:2;grid-row:2/5;background:var(--card);border:1px solid var(--line);border-radius:10px;
    padding:16px 18px;overflow:hidden auto;font-size:13px;color:var(--ink2);display:flex;flex-direction:column}
  aside h2{font-size:16px;margin:0 0 4px;color:var(--ink)}
  aside .sub{color:var(--mute);font-size:12px;margin-bottom:12px}
  aside h4{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:14px 0 6px}
  aside p{margin:0 0 6px;line-height:1.45}
  aside .tags{display:flex;flex-wrap:wrap;gap:5px}
  aside .tag{font-size:11.5px;border:1px solid var(--soft);border-radius:999px;padding:2px 8px;background:#fafbfc}
  aside .open{border-left:3px solid var(--e);padding-left:8px;font-size:12.5px}
  .who{display:flex;gap:6px 10px;flex-wrap:wrap;margin-bottom:6px}
  .who span{font-size:12px;display:flex;align-items:center;gap:5px}
  .nest{border:1.5px solid var(--p);background:#e6edf5;border-radius:10px;padding:7px 10px 9px;font-size:12px;font-weight:700;color:var(--p)}
  .nest .nest{margin-top:6px}
  .nest.mid{border-color:#9aa5b1;background:#f3f5f8;color:var(--ink2)}
  .nest.cmg{border-color:var(--c);background:#e3f4f1;color:var(--c)}
  .nest.ent{border-color:var(--e);background:#fcf1e1;color:#b8741a;padding:10px}
  .key{display:grid;grid-template-columns:44px 1fr;gap:6px 8px;align-items:center;font-size:12px}
  .hint{margin-top:auto;padding-top:8px;font-size:11.5px;color:var(--mute)}
  /* diagram states */
  .step{cursor:pointer;transition:opacity .15s}
  .step .card{fill:var(--card);stroke:var(--line);stroke-width:1.2}
  .step:hover .card,.step.sel .card{stroke:var(--ink2);stroke-width:1.8}
  .step.hl .card{stroke:var(--ink);stroke-width:2.2}
  .step.cue .card{stroke:var(--c);stroke-width:1.6;stroke-dasharray:6 4;fill:#f0f9f7}
  .step.cue:hover .card,.step.cue.sel .card{stroke-width:2.2}
  svg.focus .step:not(.hl){opacity:.22}
  svg.focus .flow{opacity:.25}
  .t{fill:var(--ink);font-size:15px;font-weight:700}
  .f{fill:var(--ink2);font-size:12.5px}
  .ct{fill:var(--mute);font-size:11px}
  .numc{fill:#2f3a45}.numt{fill:#fff;font-size:13px;font-weight:700;text-anchor:middle}
  .money{fill:#e8f4ea;stroke:var(--m)}
  .moneyt{fill:var(--m);font-size:10px;font-weight:700;text-anchor:middle}
  .proc{stroke:#5b6570;stroke-width:2;fill:none}
  /* inner loop pop-up */
  .pop{position:absolute;inset:0;border-radius:12px;background:rgba(241,245,250,.88);display:flex;align-items:center;justify-content:center;padding:30px 16px 14px}
  .pop[hidden]{display:none}
  .inner{position:relative;width:100%;border:2px solid var(--c);border-radius:14px;background:#f0f9f7;padding:28px 10px 8px;
    box-shadow:0 14px 40px -14px rgba(20,40,60,.4)}
  .inner::before{content:"CMG · lends to women members (inner loop)";position:absolute;top:-1px;left:-1px;background:var(--c);color:#fff;
    font-size:12px;font-weight:700;padding:4px 12px;border-radius:12px 0 10px 0;letter-spacing:.02em}
  .inner svg{height:auto}
  .inner .x{position:absolute;top:2px;right:8px;font:inherit;font-size:20px;line-height:1;background:none;border:0;color:var(--ink2);cursor:pointer;padding:2px 6px}
</style>
</head>
<body>
<div class="app">
  <header><h1>CMG Financing Lifecycle</h1><span>PAMOJA Sub-Component 1.2 · v7 (rough cut) · FI-led model · click any step or label</span></header>

  <div class="rail" id="railCom"><span class="rl">COM covers</span></div>

  <div class="stage">
    <svg id="dg" viewBox="0 0 1080 488" preserveAspectRatio="xMidYMid meet"></svg>
    <div class="pop" id="pop" hidden>
      <div class="inner" role="dialog" aria-label="Inner loop: the CMG lends to women members">
        <button class="x" id="popX" aria-label="Close">×</button>
        <svg id="dgIn" viewBox="0 0 1080 284" preserveAspectRatio="xMidYMid meet"></svg>
      </div>
    </div>
  </div>

  <div class="rails-bottom">
    <div class="rail" id="railPor"><span class="rl p"><i class="dot" style="background:var(--p)"></i>PO-RALG must</span></div>
    <div class="rail" id="railLga"><span class="rl"><i class="dot" style="background:var(--l)"></i>Council must</span></div>
    <div class="rail" id="railFi"><span class="rl"><i class="dot" style="background:var(--fi)"></i>FI must</span></div>
    <div class="rail" id="railCmg"><span class="rl"><i class="dot" style="background:var(--c)"></i>CMG must</span></div>
    <div class="rail" id="railEnt"><span class="rl"><i class="dot" style="background:var(--e)"></i>Entrepreneur must</span></div>
  </div>

  <aside id="panel"></aside>
</div>

<script>
const COL={P:'#1f4e79',L:'#4a8fd1',F:'#b8437f',C:'#1f9e89',E:'#e39b2d'};
const NAME={P:'PO-RALG',L:'Council',F:'FI',C:'CMG',E:'Entrepreneur'};

/* Outer loop: the FI–CMG loan, in seven stages. */
const STEPS=[
 {n:'1',x:20, y:10, t:['Apply'],owners:['C'],note:'In Wezesha, with the amount',
  what:'The CMG applies in Wezesha, stating the amount it needs.'},
 {n:'2',x:290,y:10, t:['Check'],owners:['L'],note:'Ward, then council',
  what:'The ward and the council check the application and recommend. The Director submits the list to the CMT.',
  open:'Accuracy is checked four times: ward CDO, head of CD, the council and the FI. Does each check look for something different?'},
 {n:'3',x:560,y:10, t:['Decide'],owners:['L','F'],note:'Council shortlists; FI decides',
  what:'The CMT endorses a shortlist. The FI appraises the shortlisted CMGs and decides the amount, or rejects with reasons. The FI’s decision is final.',
  open:'Not found: a time limit for the FI’s review, and whether a CMG can appeal if the FI declines.'},
 {n:'4',x:830,y:10, t:['Contract'],tabs:['F','C'],doc:1,note:'On-lending agreed up front',mk:['◆','CMG obligations start'],
  what:'The FI signs its own loan contract with each CMG, as the lender. Up front, PO-RALG signs an on-lending agreement with the FI.',
  open:'Who lends to the FI: PO-RALG or the council?'},
 {n:'5',x:830,y:300,t:['Pay out'],owners:['L','F'],money:['Council','FI','CMG'],note:'PO-RALG allocates funds first',
  what:'PO-RALG allocates funds to the council. The Director pays the FI, and the FI pays the CMG from its own books. The CMG then lends to its women members (inner loop).',
  open:'One transfer per round, or instalments? And the time limit for the FI to lend after it receives the funds.'},
 {n:'6',x:560,y:300,t:['Repay'],owners:['C','F'],money:['CMG','FI','Pamoja fund'],mk:['◆','CMG obligations end'],
  what:'The CMG repays the FI in the FI’s own system. The FI repays on schedule, via account B into the Pamoja fund, and reports monthly, quarterly and annually.',
  open:'PO-RALG’s role in repayment is an open item. What happens to money in the Pamoja fund: relend or loss?'},
 {n:'7',x:290,y:300,t:['If not repaid'],owners:['F'],note:'Loss split by agreed share',mk:['⚖','FI leads recovery'],
  what:'If a CMG does not repay, the FI leads recovery under its own rules. The Pamoja fund is protected; the loss is split by an agreed share.',
  open:'The share each party carries is to be agreed. Not found: a definition of default. Who escalates to whom?'}
];
/* Inner loop: the CMG lends to its women members. Sits between Pay out (5) and Repay (6). */
const INNER=[
 {n:'5.1',x:20, y:44,t:['Subproject','selected'],owners:['C'],note:'A woman member’s idea',
  what:'The CMG selects a woman member’s eligible productive Subproject.'},
 {n:'5.2',x:290,y:44,t:['Microfinancing','Agreement'],tabs:['C','E'],doc:1,mk:['◆','Ent. obligations start'],
  what:'CMG and entrepreneur sign: amount, currency, charges, repayment schedule, and the CMG’s remedies on default.'},
 {n:'5.3',x:560,y:44,t:['Lend · Monitor','· Report'],owners:['C','E'],money:['CMG','Entrepreneur'],mk:['◆','Both monitor & report'],
  what:'The CMG disburses the loan; both track and report Subproject progress.'},
 {n:'5.4',x:830,y:44,t:['Repayment'],owners:['E'],money:['Entrepreneur','CMG'],mk:['⚖','CMG enforces if default'],
  what:'The entrepreneur repays; the CMG re-lends repayments to new Subprojects, and repays the FI (step 6).'}
];
const BYN={};[...STEPS,...INNER].forEach(s=>BYN[s.n]=s);
const INN=INNER.map(s=>s.n);

const ALL=[...STEPS,...INNER].map(s=>s.n);
const RAILS={
 railCom:[
  ['a','Structure','Who is in charge of what','Roles, responsibilities and decision-making for selecting, monitoring and evaluating CMGs and their Subprojects.',ALL],
  ['b','Entry','Which CMGs qualify and how they are chosen','Eligibility (incl. minimum institutional requirements), prioritisation, application and selection procedures.',['1','2','3']],
  ['c','Lending terms','Limits, repayment and charges','Single borrower limits, repayment schedules, charges.',['4','5.2']],
  ['d','Money flow','How funds move, and the agreement for each transfer','Flow of funds to the CMG, now through the council and the FI; agreement templates; approval and signing protocol.',['4','5']],
  ['e','Use of funds','Who and what CMGs may finance','Beneficiary and Subproject eligibility, negative list, social and environmental restrictions — on top of the CMG’s own rules.',['5.1']],
  ['f','Accountability','How CMGs keep accounts and report','Financial management requirements, including regular reporting to DITs.',['5.3']],
  ['g','Safeguards','CMGs’ environmental and social duties','Obligations under the M-ESCP and ancillary documents.',['5.1','5.3']]
 ],
 railPor:[
  ['','Adopt COM','Prepare and adopt the rulebook','The COM sets structure, entry, lending terms, fund flow, use of funds, accountability and safeguards.',ALL],
  ['','Sign & fund','Sign the on-lending agreement and allocate funds','On-lending agreement with the FI, up front; funds allocated to the council, whose Director pays the FI.',['4','5']],
  ['','Oversee','Receive reports, inspect, request information','Via DITs: regular CMG reporting; FI reports monthly, quarterly and annually; right to inspect records and request information.',['5.3','5.4','6','7']],
  ['','Ensure enforcement','Make sure CMGs use their rights','Require and ensure each CMG enforces its Microfinancing Agreements to protect the funds.',['5.4']],
  ['','Receive repayments','Repayments return to the Pamoja fund','Via account B into the Pamoja fund at Bank of Tanzania. Whether the fund relends is still to settle.',['6','1']]
 ],
 railLga:[
  ['','Check','Check each application and recommend','Ward CDO checks and the ward credit committee visits the CMG; head of CD checks and the council credit committee recommends.',['2']],
  ['','Shortlist','Put forward a shortlist','The Director submits the list; the DCRC advises; the CMT endorses a shortlist for the FI. A shortlist, not an approval.',['2','3']],
  ['','Pay the FI','The Director pays the FI','From the funds PO-RALG allocates to the council.',['5']]
 ],
 railFi:[
  ['','Decide','Appraise and decide the amount','Appraises the shortlisted CMGs; decides the amount, or rejects with reasons. Its decision is final.',['3']],
  ['','Contract','Sign its own loan contract with each CMG','As the lender. Also signs the on-lending agreement with PO-RALG, up front.',['4']],
  ['','Pay out','Pay the CMG from its own books','After the Director pays the FI.',['5']],
  ['','Collect','Collect repayments in its own system','The CMG repays the FI in the FI’s system, not through a GePG control number.',['6']],
  ['','Repay','Repay on schedule','Via account B into the Pamoja fund. PO-RALG’s role here is an open item.',['6']],
  ['','Report','Report monthly, quarterly and annually','Paid from its interest share; no management fees.',['6']],
  ['','Recover','Lead recovery if a CMG does not repay','Under its own rules. The loss is split by an agreed share.',['7']]
 ],
 railCmg:[
  ['','Apply','Apply in Wezesha','State the amount the CMG needs.',['1']],
  ['','Lend','Only to women members, only for eligible Subprojects','On reasonable terms acceptable to PO-RALG.',['5.1','5.2','5.3']],
  ['','Manage','Handle the funds honestly and well','Due diligence; Anti-Corruption Guidelines; add own resources if needed.',['4','5','5.1','5.2','5.3','5.4','6']],
  ['','Monitor','Track members’ Subprojects','Policies and procedures to monitor and evaluate progress.',['5.3']],
  ['','Account','Account for every shilling','Financial management system and financial statements for the funds received.',['5.3','6']],
  ['','Allow inspection','Records open, information on request','Allow inspection of operations and records; provide information reasonably requested.',['4','5','5.1','5.2','5.3','5.4','6','7']],
  ['','Enforce','Protect the funds under each agreement','Use its rights on default; never assign, amend or waive standard terms.',['5.4']],
  ['','Repay','Repay the FI as agreed','In the FI’s own system, per the loan contract. Members are jointly liable.',['6']]
 ],
 railEnt:[
  ['','Deliver','Carry out the Subproject properly','Due diligence; Anti-Corruption Guidelines; add own resources if needed.',['5.3']],
  ['','Monitor','Track own Subproject progress','Regular monitoring and evaluation.',['5.3']],
  ['','Account','Keep accounts','Financial statements on CMG request.',['5.3']],
  ['','Allow inspection','Records open, information on request','Allow inspection by PO-RALG and the CMG; provide information on request.',['5.3','5.4']],
  ['','Repay','Repay as agreed','Per the amount, charges and schedule in the Microfinancing Agreement.',['5.4']]
 ]
};
const RAILNAME={railCom:'COM area',railPor:'PO-RALG obligation',railLga:'Council role · proposed FI-led model',railFi:'FI role · proposed FI-led model',railCmg:'CMG obligation',railEnt:'Entrepreneur obligation'};

/* ---------- build SVG ---------- */
const svg=document.getElementById('dg'), svgIn=document.getElementById('dgIn');
const mark=(id,fill)=>`<marker id="${id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="${fill}"/></marker>`;
const doc=(x,y)=>`<g transform="translate(${x},${y})"><rect width="16" height="20" rx="2" fill="#fff" stroke="#2f3a45"/><path d="M4 6H12M4 10H12M4 14H10" stroke="#2f3a45"/></g>`;
const card=s=>{
  const {x,y}=s, w=220, tab=s.tabs?14:0;
  let g=`<g class="step" data-n="${s.n}" tabindex="0"><rect class="card" x="${x}" y="${y}" width="${w}" height="160" rx="10"/>`;
  if(s.tabs){
    g+=`<path d="M${x+10} ${y}H${x+14}V${y+160}H${x+10}A10 10 0 0 1 ${x} ${y+150}V${y+10}A10 10 0 0 1 ${x+10} ${y}Z" fill="${COL[s.tabs[0]]}"/>`;
    g+=`<path d="M${x+w-10} ${y}H${x+w-14}V${y+160}H${x+w-10}A10 10 0 0 0 ${x+w} ${y+150}V${y+10}A10 10 0 0 0 ${x+w-10} ${y}Z" fill="${COL[s.tabs[1]]}"/>`;
  }
  const cx=x+22+tab;
  g+=`<circle class="numc" cx="${cx}" cy="${y+24}" r="13"/><text class="numt" x="${cx}" y="${y+(s.n.length>1?28:29)}"${s.n.length>1?' style="font-size:11px"':''}>${s.n}</text>`;
  s.t.forEach((l,i)=>g+=`<text class="t" x="${cx+22}" y="${y+30+i*24}">${l}</text>`);
  if(s.doc) g+=doc(x+w-40,y+12);
  (s.owners||[]).slice().reverse().forEach((o,i)=>g+=`<circle cx="${x+w-18-i*18}" cy="${y+22}" r="7" fill="${COL[o]}"/>`);
  g+=`<line x1="${x+12+tab}" y1="${y+80}" x2="${x+w-12-tab}" y2="${y+80}" stroke="#e3e8ee"/>`;
  let ry=y+104, lx=x+14+tab;
  if(s.money){g+=`<rect class="money" x="${lx}" y="${ry-13}" width="36" height="18" rx="9"/><text class="moneyt" x="${lx+18}" y="${ry}">TZS</text><text class="f" x="${lx+44}" y="${ry}">${s.money.join(' → ')}</text>`;ry+=26;}
  if(s.note){g+=`<text class="f" x="${lx}" y="${ry}">${s.note}</text>`;ry+=26;}
  if(s.mk){g+=`<text x="${lx}" y="${ry}" font-size="${s.mk[0]=='⚖'?15:14}" fill="${s.mk[0]=='⚖'?'#8a2d2d':'#6a3fa0'}">${s.mk[0]}</text><text class="f" x="${lx+18}" y="${ry}">${s.mk[1]}</text>`;ry+=26;}
  const tags=RAILS.railCom.filter(r=>r[4]!==ALL&&r[4].includes(s.n)).map(r=>r[0]);
  if(tags.length&&ry<=y+140) g+=`<text class="ct" x="${lx}" y="${y+148}">COM ${tags.join(' · ')}</text>`;
  return g+'</g>';
};

let h=`<defs>${mark('ah','#5b6570')}${mark('ahC',COL.C)}${mark('ahP',COL.P)}${mark('ahE','#8a2d2d')}</defs>`;
h+=`<g class="flow">
 <line class="proc" x1="240" y1="90" x2="288" y2="90" marker-end="url(#ah)"/>
 <line class="proc" x1="510" y1="90" x2="558" y2="90" marker-end="url(#ah)"/>
 <line class="proc" x1="780" y1="90" x2="828" y2="90" marker-end="url(#ah)"/>
 <line class="proc" x1="940" y1="170" x2="940" y2="298" marker-end="url(#ah)"/>
 <line class="proc" x1="830" y1="380" x2="782" y2="380" marker-end="url(#ah)"/>
 <line x1="560" y1="380" x2="512" y2="380" stroke="#8a2d2d" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ahE)"/>
 <path d="M880 300V279" stroke="${COL.C}" stroke-width="2.2" stroke-dasharray="7 5" fill="none" marker-end="url(#ahC)"/>
 <path d="M670 276V297" stroke="${COL.C}" stroke-width="2.2" stroke-dasharray="7 5" fill="none" marker-end="url(#ahC)"/>
 <path d="M670 460V476H130V172" stroke="${COL.P}" stroke-width="2.2" stroke-dasharray="7 5" fill="none" marker-end="url(#ahP)"/>
 <text x="142" y="232" font-size="12.5" font-weight="600" fill="${COL.P}">↻ Repayments return to the Pamoja fund</text>
 <text x="142" y="249" class="f" font-size="12">relend or loss? still to settle</text>
</g>`;
/* cue: opens the inner loop */
h+=`<g class="step cue" data-n="inner" tabindex="0" role="button" aria-label="Open the inner loop: the CMG lends to women members">
 <rect class="card" x="590" y="196" width="310" height="80" rx="14"/>
 <text x="606" y="230" font-size="19" font-weight="700" fill="${COL.C}">↻</text>
 <text x="632" y="227" font-size="15" font-weight="700" fill="${COL.C}">CMG lends to women members</text>
 <text class="f" x="632" y="251">Inner loop · 4 steps · click to open</text>
 <circle cx="864" cy="246" r="6" fill="${COL.C}"/><circle cx="880" cy="246" r="6" fill="${COL.E}"/>
</g>`;
STEPS.forEach(s=>h+=card(s));
svg.innerHTML=h;

let hi=`<defs>${mark('ahI','#5b6570')}${mark('ahCI',COL.C)}</defs>`;
hi+=`<g class="flow">
 <text class="f" x="20" y="26">From 5 · Pay out: the CMG has the funds</text>
 <text class="f" x="1050" y="26" text-anchor="end">The CMG repays the FI from repayments → 6 · Repay</text>
 <line class="proc" x1="240" y1="124" x2="288" y2="124" marker-end="url(#ahI)"/>
 <line class="proc" x1="510" y1="124" x2="558" y2="124" marker-end="url(#ahI)"/>
 <line class="proc" x1="780" y1="124" x2="828" y2="124" marker-end="url(#ahI)"/>
 <path d="M940 204V248H130V206" stroke="${COL.C}" stroke-width="2.2" stroke-dasharray="7 5" fill="none" marker-end="url(#ahCI)"/>
 <text x="150" y="270" font-size="12.5" font-weight="600" fill="${COL.C}">↻ CMG re-lends repayments</text>
 <text x="330" y="270" class="f" font-size="12">new Subproject + new agreement</text>
</g>`;
INNER.forEach(s=>hi+=card(s));
svgIn.innerHTML=hi;

/* ---------- rails ---------- */
Object.entries(RAILS).forEach(([id,list])=>{
  const el=document.getElementById(id);
  list.forEach((r,i)=>{const b=document.createElement('button');b.className='chip'+(id==='railPor'?' p':'');b.dataset.rail=id;b.dataset.i=i;
    b.innerHTML=(r[0]?`<b>${r[0]}</b>`:'')+r[1];el.appendChild(b);});
});

/* ---------- panel ---------- */
const panel=document.getElementById('panel');
const who=arr=>`<div class="who">${arr.map(o=>`<span><i class="dot" style="background:${COL[o]}"></i>${NAME[o]}</span>`).join('')}</div>`;
function legend(){
  panel.innerHTML=`<h2>How to read this</h2><div class="sub">Seven steps, five parties, one inner loop.</div>
  <div class="nest">PO-RALG (sets, funds and oversees)<div class="nest mid"><i class="dot" style="background:${COL.L}"></i> Council · <i class="dot" style="background:${COL.F}"></i> FI<div class="nest cmg">CMG<div class="nest ent">Woman entrepreneur</div></div></div></div>
  <h4>Key</h4><div class="key">
   <svg width="40" height="22"><rect x="1" y="1" width="38" height="20" rx="4" fill="#fff" stroke="#c9d1da"/><rect x="1" y="1" width="5" height="20" fill="${COL.F}"/><rect x="34" y="1" width="5" height="20" fill="${COL.C}"/></svg><span>Side tabs — two parties to an agreement</span>
   <svg width="40" height="16"><circle cx="10" cy="8" r="6" fill="${COL.L}"/><circle cx="26" cy="8" r="6" fill="${COL.F}"/></svg><span>Badges — who carries out the step</span>
   <svg width="40" height="22">${doc(12,1)}</svg><span>Written agreement signed</span>
   <svg width="40" height="18"><rect x="1" y="1" width="36" height="16" rx="8" fill="#e8f4ea" stroke="#2e7d32"/><text x="19" y="13" font-size="9.5" font-weight="700" fill="#2e7d32" text-anchor="middle">TZS</text></svg><span>Money moves (from → to)</span>
   <span style="color:#6a3fa0;font-size:15px;text-align:center">◆</span><span>Obligations start / apply / end</span>
   <span style="color:#8a2d2d;font-size:15px;text-align:center">⚖</span><span>Enforcement</span>
   <svg width="40" height="10"><path d="M2 5H34" stroke="#8a2d2d" stroke-width="2" stroke-dasharray="5 4"/></svg><span>If the CMG does not repay</span>
   <svg width="40" height="10"><path d="M2 5H34" stroke="${COL.C}" stroke-width="2" stroke-dasharray="5 4"/></svg><span>↻ Revolving funds</span>
   <svg width="40" height="18"><rect x="2" y="2" width="34" height="14" rx="5" fill="#f0f9f7" stroke="${COL.C}" stroke-dasharray="4 3"/></svg><span>Inner loop — click to open</span>
  </div><div class="hint">Click a step or a label to see what applies. Esc to reset.</div>`;
}
const lbl=r=>`${r[0]?r[0]+' · ':''}${r[1]}`;
function showStep(s){
  const parts=s.tabs||s.owners;
  const pick=id=>RAILS[id].filter(r=>r[4]!==ALL&&r[4].includes(s.n)).map(r=>`<span class="tag">${lbl(r)}</span>`).join('');
  const grp=(id,title)=>{const t=pick(id);return t?`<h4>${title}</h4><div class="tags">${t}</div>`:'';};
  panel.innerHTML=`<h2>${s.n}. ${s.t.join(' ').replace('· ·','·')}</h2>${who(parts)}
   <p>${s.what}</p>
   ${s.money?`<h4>Money</h4><p>TZS: ${s.money.join(' → ')}</p>`:''}
   ${s.open?`<h4>Still to settle</h4><p class="open">${s.open}</p>`:''}
   <h4>COM areas</h4><div class="tags">${pick('railCom')||'<span class="tag">—</span>'}</div>
   ${grp('railPor','PO-RALG obligations in play')}${grp('railLga','Council role in play')}${grp('railFi','FI role in play')}
   ${grp('railCmg','CMG obligations in play')}${grp('railEnt','Entrepreneur obligations in play')}
   <div class="hint">Always in play: COM a · Structure; PO-RALG · Adopt COM.</div>`;
}
function showCue(){
  panel.innerHTML=`<h2>Inner loop: CMG lends to women members</h2>${who(['C','E'])}
   <p>Between Pay out (5) and Repay (6), the CMG lends the funds on to its women members.</p>
   <p>Four steps repeat: Subproject selected → Microfinancing Agreement → Lend · Monitor · Report → Repayment. The CMG re-lends repayments to new Subprojects, and repays the FI at step 6.</p>
   <h4>Steps inside</h4><div class="tags">${INNER.map(s=>`<span class="tag">${s.n} · ${s.t.join(' ').replace('· ·','·')}</span>`).join('')}</div>
   <div class="hint">Click to open the inner loop. Esc to close.</div>`;
}
function showChip(id,r){
  panel.innerHTML=`<h2>${r[0]?r[0]+'. ':''}${r[1]}</h2><div class="sub">${RAILNAME[id]}</div>
   <p><b>${r[2]}</b></p><p>${r[3]}</p>
   <h4>Applies at steps</h4><div class="tags">${r[4]===ALL?'<span class="tag">All steps</span>':r[4].map(n=>`<span class="tag">${n}</span>`).join('')}</div>
   ${r[4]!==ALL&&r[4].some(n=>INN.includes(n))?'<div class="hint">Steps 5.1 to 5.4 are in the inner loop: open “CMG lends to women members”.</div>':''}`;
}

/* ---------- interaction ---------- */
let pinned=null;
const pop=document.getElementById('pop');
const steps=[...document.querySelectorAll('.step')];
const stepEl=n=>document.querySelector(`.step[data-n="${n}"]`);
const cue=stepEl('inner');
function clear(){[svg,svgIn].forEach(s=>s.classList.remove('focus'));steps.forEach(g=>g.classList.remove('hl','sel'));document.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));}
function apply(sel){
  clear();
  if(!sel){legend();return;}
  if(sel.type==='step'){
    stepEl(sel.n).classList.add('sel');
    if(sel.n==='inner') showCue(); else showStep(BYN[sel.n]);
  } else {
    const r=RAILS[sel.rail][sel.i];[svg,svgIn].forEach(s=>s.classList.add('focus'));
    r[4].forEach(n=>stepEl(n).classList.add('hl'));
    if(r[4].some(n=>INN.includes(n))) cue.classList.add('hl');
    document.querySelector(`.chip[data-rail="${sel.rail}"][data-i="${sel.i}"]`).classList.add('on');showChip(sel.rail,r);
  }
}
const same=(a,b)=>a&&b&&a.type===b.type&&a.n===b.n&&a.rail===b.rail&&a.i===b.i;
function toggle(sel){pinned=same(pinned,sel)?null:sel;apply(pinned);}
function openPop(){pop.hidden=false;pinned=null;apply(null);}
function closePop(){pop.hidden=true;if(pinned&&pinned.type==='step'&&INN.includes(pinned.n)){pinned=null;apply(null);}}
steps.forEach(g=>{const n=g.dataset.n, act=n==='inner'?openPop:()=>toggle({type:'step',n});
  g.addEventListener('click',e=>{e.stopPropagation();act();});
  g.addEventListener('mouseenter',()=>{if(!pinned)apply({type:'step',n});});
  g.addEventListener('mouseleave',()=>{if(!pinned)apply(null);});
  g.addEventListener('keydown',e=>{if(e.key==='Enter'){e.stopPropagation();act();}});
});
document.querySelectorAll('.chip').forEach(c=>{const sel={type:'chip',rail:c.dataset.rail,i:+c.dataset.i};
  c.addEventListener('click',e=>{e.stopPropagation();toggle(sel);});
  c.addEventListener('mouseenter',()=>{if(!pinned)apply(sel);});
  c.addEventListener('mouseleave',()=>{if(!pinned)apply(null);});
});
document.getElementById('popX').addEventListener('click',e=>{e.stopPropagation();closePop();});
pop.addEventListener('click',e=>{if(e.target===pop)closePop();});
document.addEventListener('click',()=>{pinned=null;apply(null);});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(pinned){pinned=null;apply(null);}else closePop();}});
legend();
</script>
</body>
</html>
