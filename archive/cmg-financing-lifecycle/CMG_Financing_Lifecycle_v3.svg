<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 800" width="1160" height="800" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5b6570"/></marker>
    <marker id="ahT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f9e89"/></marker>
    <marker id="ahB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f4e79"/></marker>
    <style>
      .card{fill:#fff;stroke:#c9d1da;stroke-width:1.2}
      .num{fill:#2f3a45}
      .numt{fill:#fff;font-size:13px;font-weight:700;text-anchor:middle}
      .t{fill:#1d2630;font-size:15px;font-weight:700}
      .f{fill:#3b4652;font-size:12.5px}
      .div{stroke:#e3e8ee;stroke-width:1}
      .proc{stroke:#5b6570;stroke-width:2;fill:none}
      .money{fill:#e8f4ea;stroke:#2e7d32;stroke-width:1}
      .moneyt{fill:#2e7d32;font-size:10.5px;font-weight:700;text-anchor:middle}
      .ob{fill:#6a3fa0;font-size:14px}
      .hov{cursor:help}
      .small{fill:#3b4652;font-size:12px}
      .lbl{font-size:12.5px;font-weight:600}
    </style>
  </defs>

  <rect width="1160" height="800" fill="#f7f9fb"/>
  <text x="60" y="44" font-size="22" font-weight="700" fill="#1d2630">CMG Financing Lifecycle</text>
  <text x="60" y="66" font-size="13" fill="#5b6570">PAMOJA Sub-Component 1.2 · v3 (draft) · hover ◆ and ⚖ for detail</text>

  <!-- ===== STEP 1 ===== -->
  <rect class="card" x="60" y="90" width="220" height="160" rx="10"/>
  <circle class="num" cx="82" cy="114" r="13"/><text class="numt" x="82" y="119">1</text>
  <text class="t" x="104" y="120">CMG selected</text>
  <circle cx="262" cy="112" r="7" fill="#1f4e79"><title>PO-RALG</title></circle>
  <line class="div" x1="72" y1="170" x2="268" y2="170"/>
  <text class="f" x="74" y="192">Eligibility, prioritisation</text>
  <text class="f" x="74" y="210">&amp; selection per COM</text>

  <!-- ===== STEP 2 (agreement: side tabs) ===== -->
  <rect class="card" x="330" y="90" width="220" height="160" rx="10"/>
  <path d="M340 90 H344 V250 H340 A10 10 0 0 1 330 240 V100 A10 10 0 0 1 340 90 Z" fill="#1f4e79"><title>PO-RALG</title></path>
  <path d="M540 90 H536 V250 H540 A10 10 0 0 0 550 240 V100 A10 10 0 0 0 540 90 Z" fill="#1f9e89"><title>CMG</title></path>
  <circle class="num" cx="366" cy="114" r="13"/><text class="numt" x="366" y="119">2</text>
  <text class="t" x="388" y="120">Deposit</text>
  <text class="t" x="388" y="144">Agreement</text>
  <g transform="translate(510,102)"><rect width="16" height="20" rx="2" fill="#fff" stroke="#2f3a45"/><line x1="4" y1="6" x2="12" y2="6" stroke="#2f3a45"/><line x1="4" y1="10" x2="12" y2="10" stroke="#2f3a45"/><line x1="4" y1="14" x2="10" y2="14" stroke="#2f3a45"/></g>
  <line class="div" x1="350" y1="170" x2="530" y2="170"/>
  <rect class="money" x="354" y="180" width="34" height="18" rx="9"/><text class="moneyt" x="371" y="193">TSh</text>
  <text class="f" x="396" y="193">PO-RALG → CMG</text>
  <g class="hov"><title>CMG obligations (item c):
• On-lend only to women entrepreneur members
• Manage funds with diligence; follow Anti-Corruption Guidelines
• Monitor members' Subprojects
• Keep accounts and financial statements
• Allow inspection of operations and records
• Provide information on request
• Refund unused funds within 60 days</title>
    <text class="ob" x="354" y="226">◆</text><text class="f" x="372" y="225">CMG obligations start</text></g>

  <!-- ===== STEP 3 ===== -->
  <rect class="card" x="600" y="90" width="220" height="160" rx="10"/>
  <circle class="num" cx="622" cy="114" r="13"/><text class="numt" x="622" y="119">3</text>
  <text class="t" x="644" y="120">Subproject</text>
  <text class="t" x="644" y="144">selected</text>
  <circle cx="802" cy="112" r="7" fill="#1f9e89"><title>CMG</title></circle>
  <line class="div" x1="612" y1="170" x2="808" y2="170"/>
  <text class="f" x="614" y="192">Women members only</text>
  <text class="f" x="614" y="210">Eligibility + negative list</text>
  <text class="f" x="614" y="228">+ E&amp;S screening</text>

  <!-- ===== STEP 4 (agreement: side tabs) ===== -->
  <rect class="card" x="870" y="90" width="220" height="160" rx="10"/>
  <path d="M880 90 H884 V250 H880 A10 10 0 0 1 870 240 V100 A10 10 0 0 1 880 90 Z" fill="#1f9e89"><title>CMG</title></path>
  <path d="M1080 90 H1076 V250 H1080 A10 10 0 0 0 1090 240 V100 A10 10 0 0 0 1080 90 Z" fill="#e39b2d"><title>Entrepreneur</title></path>
  <circle class="num" cx="906" cy="114" r="13"/><text class="numt" x="906" y="119">4</text>
  <text class="t" x="928" y="120">Microfinancing</text>
  <text class="t" x="928" y="144">Agreement</text>
  <g transform="translate(1050,102)"><rect width="16" height="20" rx="2" fill="#fff" stroke="#2f3a45"/><line x1="4" y1="6" x2="12" y2="6" stroke="#2f3a45"/><line x1="4" y1="10" x2="12" y2="10" stroke="#2f3a45"/><line x1="4" y1="14" x2="10" y2="14" stroke="#2f3a45"/></g>
  <line class="div" x1="890" y1="170" x2="1070" y2="170"/>
  <text class="f" x="894" y="192">Amount, charges, repayment</text>
  <text class="f" x="894" y="208">schedule, CMG remedies</text>
  <g class="hov"><title>Entrepreneur obligations (para 6c):
• Carry out Subproject with diligence; follow Anti-Corruption Guidelines
• Monitor and evaluate Subproject progress
• Keep accounts; financial statements on CMG request
• Allow inspection by PO-RALG and CMG
• Provide information on request
• Repay per the agreed schedule</title>
    <text class="ob" x="894" y="233">◆</text><text class="f" x="912" y="232">Ent. obligations start</text></g>

  <!-- ===== STEP 5 (shared activity: badges) ===== -->
  <rect class="card" x="870" y="380" width="220" height="160" rx="10"/>
  <circle class="num" cx="892" cy="404" r="13"/><text class="numt" x="892" y="409">5</text>
  <text class="t" x="914" y="410">Lend · Monitor</text>
  <text class="t" x="914" y="434">· Report</text>
  <circle cx="1054" cy="402" r="7" fill="#1f9e89"><title>CMG</title></circle>
  <circle cx="1072" cy="402" r="7" fill="#e39b2d"><title>Entrepreneur</title></circle>
  <line class="div" x1="882" y1="460" x2="1078" y2="460"/>
  <rect class="money" x="884" y="470" width="34" height="18" rx="9"/><text class="moneyt" x="901" y="483">TSh</text>
  <text class="f" x="926" y="483">CMG → Entrepreneur</text>
  <text class="ob" x="884" y="516">◆</text><text class="f" x="902" y="515">Both monitor &amp; report</text>

  <!-- ===== STEP 6 ===== -->
  <rect class="card" x="600" y="380" width="220" height="160" rx="10"/>
  <circle class="num" cx="622" cy="404" r="13"/><text class="numt" x="622" y="409">6</text>
  <text class="t" x="644" y="410">Repayment</text>
  <circle cx="802" cy="402" r="7" fill="#e39b2d"><title>Entrepreneur</title></circle>
  <line class="div" x1="612" y1="460" x2="808" y2="460"/>
  <rect class="money" x="614" y="470" width="34" height="18" rx="9"/><text class="moneyt" x="631" y="483">TSh</text>
  <text class="f" x="656" y="483">Entrepreneur → CMG</text>
  <g class="hov"><title>Enforcement (para 7):
• CMG must use its rights to protect PO-RALG and CMG interests
• Remedies: suspend, terminate, or call the loan due
• CMG may not assign, amend or waive standard terms</title>
    <text x="614" y="517" font-size="15" fill="#8a2d2d">⚖</text><text class="f" x="636" y="515">CMG enforces if default</text></g>

  <!-- ===== STEP 7 ===== -->
  <rect class="card" x="330" y="380" width="220" height="160" rx="10"/>
  <circle class="num" cx="352" cy="404" r="13"/><text class="numt" x="352" y="409">7</text>
  <text class="t" x="374" y="410">Close-out &amp;</text>
  <text class="t" x="374" y="434">refund</text>
  <circle cx="532" cy="402" r="7" fill="#1f9e89"><title>CMG</title></circle>
  <line class="div" x1="342" y1="460" x2="538" y2="460"/>
  <rect class="money" x="344" y="470" width="34" height="18" rx="9"/><text class="moneyt" x="361" y="483">TSh</text>
  <text class="f" x="386" y="483">CMG → PO-RALG</text>
  <text class="f" x="386" y="499">unused, within 60 days</text>
  <text class="ob" x="344" y="527">◆</text><text class="f" x="362" y="526">CMG obligations end</text>

  <!-- ===== PROCESS ARROWS ===== -->
  <line class="proc" x1="280" y1="170" x2="328" y2="170" marker-end="url(#ah)"/>
  <line class="proc" x1="550" y1="170" x2="598" y2="170" marker-end="url(#ah)"/>
  <line class="proc" x1="820" y1="170" x2="868" y2="170" marker-end="url(#ah)"/>
  <line class="proc" x1="980" y1="250" x2="980" y2="378" marker-end="url(#ah)"/>
  <line class="proc" x1="870" y1="460" x2="822" y2="460" marker-end="url(#ah)"/>
  <line class="proc" x1="600" y1="460" x2="552" y2="460" marker-end="url(#ah)"/>

  <!-- ===== REVOLVING LOOPS ===== -->
  <path d="M710 380 V252" stroke="#1f9e89" stroke-width="2.2" stroke-dasharray="7 5" fill="none" marker-end="url(#ahT)"/>
  <text class="lbl" x="720" y="306" fill="#1f9e89">↻ CMG re-lends repayments</text>
  <text class="small" x="720" y="323">new Subproject + new agreement</text>

  <path d="M330 510 H170 V252" stroke="#1f4e79" stroke-width="2.2" stroke-dasharray="7 5" fill="none" marker-end="url(#ahB)"/>
  <text class="lbl" x="60" y="560" fill="#1f4e79">↻ PO-RALG redeploys refunds</text>
  <text class="small" x="60" y="577">to a new CMG (back to step 1)</text>

  <!-- ===== LEGEND ===== -->
  <rect x="40" y="600" width="1080" height="180" rx="10" fill="#fff" stroke="#c9d1da"/>
  <rect x="60" y="618" width="240" height="146" rx="10" fill="#e6edf5" stroke="#1f4e79"/>
  <text x="72" y="638" font-size="12.5" font-weight="700" fill="#1f4e79">PO-RALG (COM)</text>
  <rect x="76" y="648" width="208" height="104" rx="8" fill="#e3f4f1" stroke="#1f9e89"/>
  <text x="88" y="668" font-size="12.5" font-weight="700" fill="#1f9e89">CMG</text>
  <rect x="92" y="678" width="176" height="62" rx="6" fill="#fcf1e1" stroke="#e39b2d"/>
  <text x="104" y="714" font-size="12.5" font-weight="700" fill="#b8741a">Woman entrepreneur</text>

  <!-- key col 1 -->
  <rect x="340" y="624" width="36" height="24" rx="4" fill="#fff" stroke="#c9d1da"/><rect x="340" y="624" width="5" height="24" fill="#1f4e79"/><rect x="371" y="624" width="5" height="24" fill="#1f9e89"/>
  <text class="small" x="390" y="640">Side tabs = two parties to an agreement</text>
  <circle cx="350" cy="672" r="7" fill="#1f9e89"/><circle cx="367" cy="672" r="7" fill="#e39b2d"/>
  <text class="small" x="390" y="676">Badges = who carries out the step</text>
  <g transform="translate(350,694)"><rect width="16" height="20" rx="2" fill="#fff" stroke="#2f3a45"/><line x1="4" y1="6" x2="12" y2="6" stroke="#2f3a45"/><line x1="4" y1="10" x2="12" y2="10" stroke="#2f3a45"/><line x1="4" y1="14" x2="10" y2="14" stroke="#2f3a45"/></g>
  <text class="small" x="390" y="709">Written agreement signed</text>
  <rect class="money" x="341" y="728" width="34" height="18" rx="9"/><text class="moneyt" x="358" y="741">TSh</text>
  <text class="small" x="390" y="741">Money moves (from → to)</text>

  <!-- key col 2 -->
  <text class="ob" x="730" y="641">◆</text><text class="small" x="760" y="640">Obligations (hover for list)</text>
  <text x="728" y="677" font-size="15" fill="#8a2d2d">⚖</text><text class="small" x="760" y="676">Enforcement (para 7)</text>
  <line class="proc" x1="722" y1="705" x2="750" y2="705" marker-end="url(#ah)"/><text class="small" x="760" y="709">Process step</text>
  <path d="M722 737 H750" stroke="#1f9e89" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#ahT)"/><text class="small" x="760" y="741">↻ Revolving funds (re-lend / redeploy)</text>
</svg>
